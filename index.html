<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0918" />
    <!-- Local-only networking: blocks third-party requests such as MediaPipe usage metrics. -->
    <meta http-equiv="Content-Security-Policy" content="connect-src 'self' ws: wss: blob: data:" />
    <meta name="description" content="Virtual fitting mirror: live 2D/3D try-on and an optional AI photo preview. A Qassim University graduation project by Lamya." />
    <meta name="author" content="Lamya" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fitting Mirror" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Link previews: a small square image beside the title and description. __SITE_ORIGIN__ is
         filled in at build time (see socialPreview in vite.config.ts); crawlers need absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Virtual Fitting Mirror" />
    <meta property="og:title" content="Virtual Fitting Mirror" />
    <meta property="og:description" content="Live 2D/3D virtual try-on and an optional AI photo preview. A Qassim University graduation project by Lamya." />
    <meta property="og:image" content="__SITE_ORIGIN__/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Virtual Fitting Mirror icon: a white shirt with a sparkle" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Virtual Fitting Mirror" />
    <meta name="twitter:description" content="Live 2D/3D virtual try-on and an optional AI photo preview. A Qassim University graduation project by Lamya." />
    <meta name="twitter:image" content="__SITE_ORIGIN__/og-image.png" />
    <title>Virtual Fitting Mirror</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
